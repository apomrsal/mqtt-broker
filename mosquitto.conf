# تحديد المنفذ واستقبال الاتصالات من جميع شبكات الحاوية
listener 10000 0.0.0.0

# تفعيل بروتوكول WebSockets
protocol websockets

# توجيه المسارات إلى /dev/null لمنع أخطاء التعامل مع مسارات الطلبات المتعددة
http_dir /dev/null

# السماح بالاتصالات بدون اسم مستخدم/كلمة مرور (للاختبار)
allow_anonymous true

# إلغاء التخزين الدائم لبيانات الجلسات لمنع تراكم الملفات
persistence false

# إعدادات مهلة الاتصال لمنع قطع الجلسات الخاملة بسرعة
keepalive_interval 60

# إعدادات السجلات لمتابعة الأداء والتصحيح
log_dest stdout
connection_messages true
log_timestamp true
