# الاستماع على المنفذ 10000 المخصص لـ Render
listener 10000 0.0.0.0

# تفعيل WebSockets ليعمل عبر Render Reverse Proxy بدون أخطاء Health Check
protocol websockets

# السماح بالاتصال بدون كلمة سر
allow_anonymous true

# إيقاف التخزين الدائم لتفادي أخطاء الصلاحيات في Render
persistence false

# إخراج السجلات مباشرة إلى الـ Console ليقرأها Render Logs
log_dest stdout
connection_messages true
log_timestamp true
